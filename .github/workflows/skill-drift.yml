# Is this plugin still current?
#
# The authoritative skill lives in the Gather app repo and is served live at
# /.well-known/skills/. This repo is a copy that only changes when someone
# rebuilds and pushes it, so it can silently fall behind. This job notices.
#
# Generated by `npm run plugin:build` in the app repo — edit it there
# (scripts/plugin-ci/skill-drift.yml), not here.

name: skill drift

on:
  push:
    branches: [main]
  schedule:
    # Daily. Drift appears when the APP deploys, which never touches this repo,
    # so a push-only trigger would never fire at the moment things break.
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      base:
        description: "Gather origin to check against"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compare against the live published skill
        env:
          # Override with a repository variable if the app moves origin.
          GATHER_BASE_URL: >-
            ${{ inputs.base || vars.GATHER_BASE_URL || 'https://gathergamestudio.com' }}
        run: node .github/check-skill-drift.mjs
